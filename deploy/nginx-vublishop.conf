# Vublishop — Nginx site config (shop.scholarnerve.com)
# Place under /etc/nginx/sites-available/ and symlink into sites-enabled.
#
# Admin UI:  https://shop.scholarnerve.com/vince-77-00
# Admin API: https://shop.scholarnerve.com/api/vince-77-00/...

server {
    listen 80;
    server_name shop.scholarnerve.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name shop.scholarnerve.com;

    # ssl_certificate     /etc/letsencrypt/live/shop.scholarnerve.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/shop.scholarnerve.com/privkey.pem;

    root /var/www/vublishop/frontend/dist;
    index index.html;

    client_max_body_size 10m;

    # SPA + hidden admin panel (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Explicit admin panel path (same SPA)
    location /vince-77-00 {
        try_files $uri $uri/ /index.html;
    }

    # Block the retired public /admin UI path
    location = /admin {
        return 404;
    }
    location /admin/ {
        return 404;
    }

    # API proxy
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin API (explicit — same upstream as /api/)
    location /api/vince-77-00/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded product images
    location /uploads/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }
}
