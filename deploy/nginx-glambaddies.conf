# GlamBaddies — Nginx site config (https://www.glambaddies.com)
# Place under /etc/nginx/sites-available/ and symlink into sites-enabled.
#
# Admin UI:  https://www.glambaddies.com/glam-baddies
# Admin API: https://www.glambaddies.com/api/glam-baddies/...
# Backend API listens on port 3100.
#
# IMPORTANT: DNS for www.glambaddies.com must point at THIS server (or Cloudflare
# proxying to this server). If DNS points at Vercel, visitors see the old site
# and /uploads + /api will not work.

server {
    listen 80;
    server_name www.glambaddies.com glambaddies.com;
    return 301 https://www.glambaddies.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.glambaddies.com glambaddies.com;

    # Prefer apex → www
    if ($host = glambaddies.com) {
        return 301 https://www.glambaddies.com$request_uri;
    }

    # ssl_certificate     /etc/letsencrypt/live/www.glambaddies.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/www.glambaddies.com/privkey.pem;

    root /var/www/glambaddies/frontend/dist;
    index index.html;

    client_max_body_size 15m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;

    # Apple Pay domain verification (Paystack / Apple)
    location = /.well-known/apple-developer-merchantid-domain-association {
        default_type application/octet-stream;
        try_files $uri =404;
    }

    # Dynamic sitemap from Express
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:3100/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /robots.txt {
        try_files $uri =404;
    }

    # Product / category uploads — ^~ so regex static rules never steal .jpg/.png
    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public";
    }

    # API proxy — GlamBaddies backend on 3100
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        client_max_body_size 15m;
    }

    # Explicit admin panel path (same SPA)
    location /glam-baddies {
        try_files $uri $uri/ /index.html;
    }

    # Legacy admin path still served by SPA redirect
    location /vince-77-00 {
        try_files $uri $uri/ /index.html;
    }

    # Block the retired public /admin UI path
    location = /admin {
        return 404;
    }
    location /admin/ {
        return 404;
    }

    # Fingerprinted frontend assets from dist/
    location ~* ^/assets/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA (React Router) — last
    location / {
        try_files $uri $uri/ /index.html;
    }
}
