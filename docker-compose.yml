services:
  postgres:
    image: postgres:17-alpine
    container_name: glambaddies-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: glambaddies_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"
    volumes:
      - glambaddies_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d glambaddies_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  glambaddies_data:
