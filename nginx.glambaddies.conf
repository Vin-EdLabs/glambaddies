# GlamBaddies — Nginx reference config for https://www.glambaddies.com
# Copy to the server (e.g. /etc/nginx/sites-available/glambaddies) and enable TLS with certbot.
#
# Paths match this repo: frontend build → /var/www/glambaddies/frontend/dist
# API process (PM2) listens on 127.0.0.1:3100
#
# DNS must point at this VPS (not Vercel). See README “Domain / DNS”.

server {
    listen 80;
    server_name glambaddies.com www.glambaddies.com;
    return 301 https://www.glambaddies.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.glambaddies.com glambaddies.com;

    # Prefer apex → www
    if ($host = glambaddies.com) {
        return 301 https://www.glambaddies.com$request_uri;
    }

    # ssl_certificate     /etc/letsencrypt/live/www.glambaddies.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/www.glambaddies.com/privkey.pem;

    root /var/www/glambaddies/frontend/dist;
    index index.html;

    client_max_body_size 15m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;

    location = /.well-known/apple-developer-merchantid-domain-association {
        default_type application/octet-stream;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:3100/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /robots.txt {
        try_files $uri =404;
    }

    # ^~ stops the static-extension regex from 404-ing uploaded product images
    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public";
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        client_max_body_size 15m;
    }

    location /glam-baddies {
        try_files $uri $uri/ /index.html;
    }

    location /vince-77-00 {
        try_files $uri $uri/ /index.html;
    }

    location = /admin {
        return 404;
    }
    location /admin/ {
        return 404;
    }

    location ~* ^/assets/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
